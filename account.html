<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аккаунт — Talaria</title>
  <link rel="stylesheet" href="account.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="account.js"></script>
</head>
<body>
  <header><a href="index.html">TALARIA</a><a href="catalog.html">Каталог</a></header>
  <main>
    <h1>Аккаунт</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <form id="auth">
      <label>Электронная почта или логин администратора<input name="login" autocomplete="username" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="actions">
        <button type="submit" value="login">Войти</button>
        <button type="submit" value="register">Зарегистрироваться</button>
      </div>
    </form>
    <section id="session" hidden>
      <p id="identity"></p>
      <button id="logout" type="button">Выйти</button>
    </section>
    <section id="admin" hidden>
      <h2>Товары</h2>
      <label>Товар для редактирования<select id="products"><option value="">Новый товар</option></select></label>
      <form id="product">
        <label>Название<input name="title" required></label>
        <label>Цена<input name="price" required placeholder="390.000 сум"></label>
        <label>Размеры<input name="sizes" placeholder="39, 40, 41"></label>
        <label>Цвет<input name="color"></label>
        <label>Описание<textarea name="description" rows="4"></textarea></label>
        <label>Ссылки на фото, по одной на строку<textarea name="photos" rows="3"></textarea></label>
        <label class="check"><input type="checkbox" name="is_available" checked> В наличии</label>
        <div class="actions">
          <button type="submit">Сохранить</button>
          <button type="button" id="remove" disabled>Удалить</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
